[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "good-code-hunters"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pyinstaller", "pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["goodcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["examples/demo_syntax_error.py"]
